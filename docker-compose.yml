version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: warehouse_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: warehouse_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: warehouse_user
      MYSQL_PASSWORD: warehouse_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - warehouse_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: warehouse_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - mysql
    networks:
      - warehouse_network

volumes:
  mysql_data:
    driver: local

networks:
  warehouse_network:
    driver: bridge
